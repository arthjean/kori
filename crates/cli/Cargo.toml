[package]
name = "kori-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line client for the Kori daemon, printing JSON for scripts and agents"

[[bin]]
name = "korictl"
path = "src/main.rs"

# kori-core is the only workspace crate this binary links. It speaks the
# protocol and owns the socket path, so the command line cannot drift from the
# window on either; it reaches no hardware crate and no renderer, which is what
# keeps it small and free of every GUI library.
[dependencies]
kori-core.workspace = true
serde.workspace = true
serde_json.workspace = true

# A real daemon on a fake machine, so the contract is proven against the server
# the binary actually talks to rather than against a mock of it.
[dev-dependencies]
kori-daemon = { path = "../daemon" }
kori-hardware-linux = { workspace = true, features = ["testing"] }

[lints]
workspace = true
