[package]
name = "kori-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line client for the Kori daemon, printing JSON for scripts and agents"

[[bin]]
name = "korictl"
path = "src/main.rs"

# kori-core is the only workspace crate this binary links. It speaks the
# protocol and owns the socket path, so the command line cannot drift from the
# window on either; it reaches no hardware crate and no renderer, which is what
# keeps it small and free of every GUI library.
[dependencies]
kori-core.workspace = true
serde.workspace = true
serde_json.workspace = true

# A real daemon on a fake machine, so the contract is proven against the server
# the binary actually talks to rather than against a mock of it.
[dev-dependencies]
kori-daemon = { path = "../daemon" }
kori-hardware-linux = { workspace = true, features = ["testing"] }
# The schema derives, for the test that holds `docs/protocol.schema.json` to
# the wire types. A dev-dependency, so resolver 2 keeps them out of `korictl`.
kori-core = { workspace = true, features = ["schema"] }
# Validates every example frame against that schema: an implementation written
# independently of the generator, so a mistake in one is not repeated by the
# other. Default features off, which drops the HTTP and TLS stack used only to
# fetch remote `$ref`s. MIT itself; the crates it adds are MIT, MIT OR
# Apache-2.0, Apache-2.0 (`unicode-general-category`), Zlib (`foldhash`) and
# MIT-0 (`borrow-or-share`), all compatible with GPL-3.0-or-later and all
# already allowed by `deny.toml`.
# Rust 1.85, under the workspace's 1.90 floor.
jsonschema = { version = "0.61", default-features = false }

[lints]
workspace = true
